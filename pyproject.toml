[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad-optimade-gateway"
version = "1.0.0"
description = "Tools for translating between OPTIMADE and NOMAD APIs."
readme = "README.md"
keywords = ["optimade", "jsonapi", "materials"]
license = "MIT"
authors = [{ name = "NOMAD development team", email = "support@nomad-lab.eu" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Database :: Front-Ends",
]
requires-python = ">=3.11"
dependencies = [
    "optimade>=1.5",
    "fastapi[standard]>=0.165.0",
]

[project.optional-dependencies]
testing = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "pytest-cov>=6,<8",
]

[project.urls]
"Homepage" = "https://github.com/FAIRmat-NFDI/nomad-optimade-gateway"
"Bug Tracker" = "https://github.com/FAIRmat-NFDI/nomad-optimade-gateway/issues"
"Documentation" = "https://github.com/FAIRmat-NFDI/nomad-optimade-gateway"


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
# Do not install the `dev` group by default; opt in with `--group dev`.
default-groups = []

[tool.uv.sources]
# Use the pinned optimade-python-tools submodule instead of the PyPI release.
optimade = { path = "deps/optimade-python-tools", editable = true }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "Q"]
ignore = ["E501", "E402"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.mypy]
plugins = "pydantic.mypy"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "-rs"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
